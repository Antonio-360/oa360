<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>¿Cómo fue su servicio? · Office Automation</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--navy:#16263D;--blue:#1B5E96;--teal:#3AAFC9;--bg:#F3F6F9;--surface:#fff;--line:#DDE3EA;--ink:#16263D;--muted:#5B6B7F;--bad:#A3163A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1826;--surface:#16233A;--line:#26364F;--ink:#E7EDF5;--muted:#9AA9BC;--bad:#FF9BB5;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{background:var(--navy);color:#fff;padding:22px 20px}
.w{max-width:560px;margin:0 auto}
.iso{display:inline-grid;grid-template-columns:10px 10px;gap:2px;vertical-align:middle;margin-right:10px}.iso i{width:10px;height:10px}
h1{font-size:26px;margin:14px 0 4px;font-weight:800}header p{margin:0;color:#C9D3DF}
main{padding:18px 20px 50px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.q.err{border-color:var(--bad)}
.q h2{font-size:16px;margin:0 0 10px;font-weight:700}.q h2 small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.op{display:flex;flex-wrap:wrap;gap:8px}
.op button{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 10px;font:inherit;font-size:15px;font-weight:600;color:inherit;cursor:pointer}
.op button.on{border-color:var(--blue);background:var(--blue);color:#fff}
.op.n5 button{flex:1 1 0;padding:11px 0}.op.n11{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}.op.n11 button{padding:10px 0;font-size:14px}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
@media (max-width:420px){.op.n11{grid-template-columns:repeat(6,1fr)}}
label.l{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 5px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:var(--surface);color:var(--ink)}
textarea{min-height:96px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-weight:600}.chk input{width:22px;height:22px;flex:none;margin:0}
button.go{margin-top:8px;width:100%;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.ok{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
.ok b{font-size:24px;display:block;margin:6px 0}
.small{font-size:13.5px;color:var(--muted)}#msg{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<header><div class="w"><span class="iso"><i style="background:#00AEEF"></i><i style="background:#EC008C"></i><i style="background:#FFD400"></i><i style="background:#000"></i></span><b>OFFICE AUTOMATION</b>
<h1>¿Cómo fue su servicio?</h1><p id="sub">Son 10 preguntas rápidas. Nos toma menos de 1 minuto y nos ayuda a mejorar.</p></div></header>
<main class="w" id="m"></main>
<script>
const P=new URLSearchParams(location.search);const TID=P.get("t")||"",FOL=P.get("f")||"",TEC=(P.get("n")||"").slice(0,40);
const tec=TEC||"el técnico";
const Q=[
 {k:"puntual",h:`¿${tec} llegó a la hora acordada?`,o:[["a_tiempo","Sí, a tiempo"],["poco","Con poco retraso"],["tarde","Llegó muy tarde"],["sin_hora","No se acordó hora"]]},
 {k:"trato",h:`Amabilidad y trato de ${tec}`,n:5,e:["Muy malo","Excelente"]},
 {k:"presentacion",h:"Presentación del técnico",s:"Imagen, identificación, orden",n:5,e:["Muy mala","Excelente"]},
 {k:"explico",h:"¿Le explicó qué tenía el equipo y qué le hizo?",o:[["si","Sí"],["no","No"]]},
 {k:"limpio",h:"¿Dejó limpia y ordenada el área de trabajo?",o:[["si","Sí"],["no","No"]]},
 {k:"resuelto",h:"¿Quedó resuelto el problema?",o:[["si","Sí, totalmente"],["parcial","En parte"],["no","No"]]},
 {k:"rapidez",h:"Desde que reportó hasta que quedó resuelto, el tiempo fue…",o:[["rapido","Más rápido de lo esperado"],["normal","Lo esperado"],["lento","Tardó demasiado"]]},
 {k:"atencion",h:"Atención cuando reportó la falla",s:"Teléfono, WhatsApp o portal",n:5,e:["Muy mala","Excelente"]},
 {k:"nps",h:"Del 0 al 10, ¿qué tan probable es que nos recomiende con otra empresa?",n:11,e:["Nada probable","Muy probable"]}
];
const R={};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const m=document.getElementById("m");
if(!TID||!FOL){m.innerHTML=`<div class="ok"><b>Liga incompleta</b><p class="small">Abra la liga completa que le enviamos por WhatsApp o escríbanos al 56 2760 6710.</p></div>`}
else{
 document.getElementById("sub").textContent=`Servicio ${FOL}. Son 10 preguntas rápidas; nos toma menos de 1 minuto y nos ayuda a mejorar.`;
 m.innerHTML=Q.map((q,i)=>`<section class="q" id="q_${q.k}"><h2>${i+1}. ${esc(q.h)}${q.s?`<small>${esc(q.s)}</small>`:""}</h2>`+
  (q.n?`<div class="op n${q.n}" role="radiogroup">${Array.from({length:q.n},(_,j)=>{const v=q.n===11?j:j+1;return `<button type="button" role="radio" aria-checked="false" data-k="${q.k}" data-v="${v}">${v}</button>`}).join("")}</div><div class="ends"><span>${esc(q.e[0])}</span><span>${esc(q.e[1])}</span></div>`
   :`<div class="op" role="radiogroup">${q.o.map(([v,t])=>`<button type="button" role="radio" aria-checked="false" data-k="${q.k}" data-v="${v}">${esc(t)}</button>`).join("")}</div>`)+`</section>`).join("")+
 `<section class="q"><h2>10. ¿Alguna queja, sugerencia o reconocimiento?<small>Opcional</small></h2><textarea id="com" maxlength="1500" placeholder="Escriba aquí lo que quiera contarnos"></textarea>
  <label class="chk"><input type="checkbox" id="llamar"> Quiero que me llame un responsable de Office Automation</label>
  <label class="l" for="nom">Su nombre (opcional)</label><input id="nom" autocomplete="name" maxlength="120">
  <div id="telw" hidden><label class="l" for="tel">¿A qué número le llamamos?</label><input id="tel" inputmode="tel" autocomplete="tel" maxlength="40"></div></section>
  <p id="msg"></p><button class="go" id="go">Enviar mis respuestas</button>
  <p class="small">Sus respuestas solo las ve el equipo de Office Automation. ¿Algo urgente? WhatsApp 56 2760 6710.</p>`;
 m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;R[k]=b.dataset.v;m.querySelectorAll(`[data-k="${k}"]`).forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-checked",on)});document.getElementById("q_"+k).classList.remove("err")});
 const ll=document.getElementById("llamar");ll.onchange=()=>{document.getElementById("telw").hidden=!ll.checked};
 document.getElementById("go").onclick=async()=>{
  const falta=Q.filter(q=>R[q.k]===undefined);const msg=document.getElementById("msg");
  if(falta.length){falta.forEach(q=>document.getElementById("q_"+q.k).classList.add("err"));msg.textContent=falta.length===1?"Falta 1 pregunta por contestar (marcada en rojo).":`Faltan ${falta.length} preguntas por contestar (marcadas en rojo).`;document.getElementById("q_"+falta[0].k).scrollIntoView({behavior:"smooth",block:"center"});return}
  const go=document.getElementById("go");go.disabled=true;go.textContent="Enviando…";msg.textContent="";
  const r={...R,trato:+R.trato,presentacion:+R.presentacion,atencion:+R.atencion,nps:+R.nps,comentario:document.getElementById("com").value.trim(),llamar:ll.checked,nombre:document.getElementById("nom").value.trim(),tel:document.getElementById("tel").value.trim()};
  try{const C=window.OA_CONFIG||{};const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
   const {error}=await sb.rpc("portal_encuesta",{p_id:TID,p_folio:FOL,p_resp:r});
   if(error){const t=/contestada/.test(error.message)?"Esta encuesta ya fue contestada. ¡Gracias!":/Liga/.test(error.message)?"La liga no es válida. Abra la liga completa que le enviamos por WhatsApp.":"No se pudo enviar. Revise su conexión e inténtelo de nuevo.";
    if(/contestada|Liga/.test(error.message)){m.innerHTML=`<div class="ok"><b>${esc(t)}</b></div>`}else{msg.textContent=t;go.disabled=false;go.textContent="Enviar mis respuestas"}return}
   const malo=r.llamar||r.resuelto!=="si"||r.nps<=6;
   m.innerHTML=`<div class="ok"><b>¡Gracias por su opinión!</b><p>${malo?"Lamentamos que algo no haya salido bien. Un responsable revisará su caso y se comunicará con usted.":"Nos da gusto que el servicio le haya funcionado. Seguimos a sus órdenes."}</p><p class="small">Office Automation · WhatsApp 56 2760 6710</p></div>`;window.scrollTo(0,0);
  }catch(e){msg.textContent="No se pudo enviar. Revise su conexión e inténtelo de nuevo.";go.disabled=false;go.textContent="Enviar mis respuestas"}
 };
}
</script>
</body>
</html>
