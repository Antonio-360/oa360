<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OA 360 · Office Automation</title>
<meta name="robots" content="noindex,nofollow">

<style>
:root{
  --navy:#16263D;--navy2:#1F3350;--blue:#1B5E96;--teal:#3AAFC9;
  --c:#00AEEF;--m:#EC008C;--y:#FFD400;--k:#1A1A1A;
  --bg:#F3F6F9;--surface:#FFFFFF;--line:#DDE3EA;--ink:#16263D;--muted:#5B6B7F;--soft:#EEF2F6;
  --ok:#0F8A5F;--warn:#C98A00;--bad:#D0254F;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1826;--surface:#16233A;--line:#26364F;--ink:#E7EDF5;--muted:#9AA9BC;--soft:#1C2B45;--navy:#0A1320;--navy2:#14213A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1826;--surface:#16233A;--line:#26364F;--ink:#E7EDF5;--muted:#9AA9BC;--soft:#1C2B45;--navy:#0A1320;--navy2:#14213A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Archivo,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
aside{background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.iso{display:grid;grid-template-columns:9px 9px;gap:2px}.iso i{width:9px;height:9px;display:block}
.brand b{font-weight:800;letter-spacing:.01em;font-size:15px;line-height:1.1}.brand small{display:block;color:#8FA3BD;font-size:11.5px;font-weight:500}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#C9D3DF;text-decoration:none;font-weight:500;font-size:14.5px}
nav a:hover{background:var(--navy2);color:#fff}
nav a.on{background:var(--blue);color:#fff}
nav a .n{margin-left:auto;background:var(--m);color:#fff;font-size:11.5px;font-weight:700;border-radius:20px;padding:0 7px}
nav .grp{color:#6F86A3;font-size:12px;font-weight:600;padding:14px 10px 4px}
.who{margin-top:auto;padding:12px 10px;border-top:1px solid #2A3E5C;font-size:13px;color:#C9D3DF}
.who b{color:#fff;display:block}
main{overflow:auto;padding:26px 30px 90px}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.top p{margin:3px 0 0;color:var(--muted)}
.top .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.mst{white-space:pre-wrap;font-size:14px;line-height:1.5;margin:6px 0 12px;overflow-wrap:anywhere}.msg{display:flex;flex-direction:column}.msg .mst:last-of-type{flex:1}mark.ph{background:#FFF3C4;color:#7A5600;border-radius:4px;padding:0 3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark.ph{background:#4A3B07;color:#FFD966}}:root[data-theme="dark"] mark.ph{background:#4A3B07;color:#FFD966}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{margin:0 0 12px;font-size:16.5px;font-weight:700}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:2fr 1fr}.g11{grid-template-columns:1fr 1fr}
/* KPI: ink-level gauges — signature element */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.kpi{padding:16px 18px 14px;border-right:1px solid var(--line);position:relative}
.kpi:last-child{border-right:0}
.kpi .v{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:13.5px;margin-top:2px}
.kpi .ink{position:absolute;left:0;top:0;bottom:0;width:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--soft)}
.wrap{overflow-x:auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--soft);white-space:nowrap}
.chip.ok{background:#DDF3EA;color:#0B6B49}.chip.warn{background:#FFF3C4;color:#7A5600}.chip.bad{background:#FCE0E8;color:#A3163A}.chip.blue{background:#DCEAF6;color:#164C7B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.ok{background:#123F31;color:#7FE0B8}:root:not([data-theme="light"]) .chip.warn{background:#4A3B07;color:#FFD966}:root:not([data-theme="light"]) .chip.bad{background:#4C1324;color:#FF9BB5}:root:not([data-theme="light"]) .chip.blue{background:#163555;color:#9CCBF2}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.muted{color:var(--muted)}.sm{font-size:13px}.b{font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input.f,select.f,textarea.f{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0}
textarea.f{width:100%;min-height:70px;resize:vertical}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.fl .f{color:var(--ink);font-weight:400;font-size:14.5px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form .full{grid-column:1/-1}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:12px;padding:10px;min-height:120px}
.col h3{margin:2px 4px 10px;font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.col h3 span{margin-left:auto;color:var(--muted);font-weight:600}
.col.drop{outline:2px dashed var(--teal)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;font-size:13.5px}
.card:hover{border-color:var(--blue)}
.card .t{font-weight:700;font-size:14px}
.card .sla{height:3px;border-radius:3px;margin:-10px -11px 8px}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(10,19,32,.45);z-index:20;display:flex;justify-content:flex-end}
.dr{width:min(760px,100%);height:100%;background:var(--bg);overflow:auto;padding:22px 24px 60px;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.dr .x{float:right}
.dr h2{margin:0 0 2px;font-size:22px;font-weight:800}.dr .panel h2{font-size:16.5px;margin:0 0 12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--blue)}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk label{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-weight:500;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
canvas.sig{width:100%;height:170px;background:#fff;border:1px dashed var(--muted);border-radius:10px;touch-action:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:40;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px}
.bars .bw{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .st{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}
.bars small{font-size:11.5px;color:var(--muted)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.tcard .t{font-size:17px;font-weight:800}
.big{padding:13px 16px;font-size:15.5px;border-radius:11px;flex:1;justify-content:center}
.mnav{display:none}
.hide{display:none!important}
.gate{max-width:520px;margin:12vh auto;text-align:center}
.gate code{background:var(--soft);padding:3px 8px;border-radius:6px;font-size:13px;word-break:break-all}
@media (max-width:1100px){.g4,.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}.g2,.g3{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}aside{display:none}
  main{padding:16px 14px 96px}
  .top h1{font-size:23px}
  .form,.g11,.chk{grid-template-columns:1fr}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);z-index:15;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .mnav a{flex:1;text-align:center;color:#C9D3DF;text-decoration:none;font-size:11.5px;font-weight:600;padding:6px 2px;border-radius:8px}
  .mnav a.on{background:var(--blue);color:#fff}
  .mnav svg{display:block;margin:0 auto 2px}
}
@media (prefers-reduced-motion:no-preference){.dr{animation:sl .22s ease-out}@keyframes sl{from{transform:translateX(40px);opacity:.4}}}

/* prospectos */
.pitem{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}.pitem:first-of-type{border-top:0}
.prio{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.meter{height:12px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--ok)}
.bulkp{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--soft);border-radius:10px;margin:10px 0}
.pfil{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.agi{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-top:1px solid var(--line)}.agi:first-of-type{border-top:0}.agi input{width:18px;height:18px;margin-top:2px}
.agi.done .b{text-decoration:line-through;color:var(--muted)}.agb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:12px;flex:none;margin-top:2px}.agi.done .agb{background:var(--ok);border-color:var(--ok);color:#fff}
.cdot{width:9px;height:9px;border-radius:2px;display:inline-block;vertical-align:middle}
.pbars{display:flex;gap:3px;align-items:flex-end;height:160px;padding-top:6px}.pbw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.pst{display:flex;flex-direction:column-reverse;min-height:1px;border-radius:3px 3px 0 0;overflow:hidden;background:var(--soft)}.pst i{display:block;min-height:1px}.pbw small{font-size:9.5px;color:var(--muted);text-align:center;white-space:nowrap;height:14px}
.frow{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;margin:9px 0}.ftr{height:24px;background:var(--soft);border-radius:4px;position:relative}.ftr div{height:100%;border-radius:4px}.ftr b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.pev{display:grid;grid-template-columns:14px 1fr;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}.pev:first-of-type{border-top:0}.pev .cdot{margin-top:4px}

/* venta */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.vcard{cursor:pointer;display:grid;gap:3px}.vimg{aspect-ratio:4/3;max-width:100%;border-radius:8px;background:var(--soft);display:grid;place-items:center;overflow:hidden;margin-bottom:6px}.vimg img{width:100%;height:100%;object-fit:cover}

/* agenda */
.agcols{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}.agcol{min-width:240px;flex:1}.agc .t{font-size:13px}.agsem td{vertical-align:top;min-width:110px}

.hev{display:grid;grid-template-columns:14px 1fr;gap:8px;padding:9px 0;border-top:1px dashed var(--line)}.hev:first-of-type{border-top:0}.hdot{width:10px;height:10px;border-radius:50%;margin-top:4px}

.form>*{min-width:0}.form .f{max-width:100%;min-width:0}.form .row{flex-wrap:nowrap}
</style>
</head>

<script>
"use strict";

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(Number(n)||0).toLocaleString("es-MX");

const TZ=-6*3600e3; // CDMX sin horario de verano
const cdmx=t=>new Date((t??Date.now())+TZ); // usar getUTC*

function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const ICON={
 inicio:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

 midia:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',

 agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M8 17h6"/>',
 cotiz:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
 mensajes:'<path d="M4 5h16v11H8l-4 4z"/>',
 config:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'
};

const S={clientes:new Map(),tecs:new Map(),vehiculos:new Map(),plantillas:new Map(),cot:new Map(),venta:new Map(),consultas:new Map(),empresa:{},tareas:new Map(),crm:null,crmHechos:{},equipos:new Map(),tickets:new Map(),opps:new Map(),sol:new Map(),inv:new Map(),
  usuarios:{},toner:[],contadores:{},me:null,rol:null,owner:false,canWrite:true,ready:{},filters:{}};

const ROLES={admin:"Administración",direccion:"Dirección",comercial:"Comercial",atencion:"Atención a clientes",jefe_tecnico:"Jefe técnico",tecnico:"Técnico"};
const ESTADOS=[["abierto","Abierto"],["asignado","Asignado"],["en_camino","En camino"],["en_sitio","En sitio"],["refaccion","Esperando refacción"],["cerrado","Cerrado"]];

const EMPRESA={nombre:"OFFICE AUTOMATION S.A. DE C.V.",dir:"Av. de los Reyes 12, MZ 018, Residencial El Dorado, 54020 Tlalnepantla de Baz, Edo. de México",wa:"5627606710",web:"www.officeautomation.com.mx",correo:"servicio@officeautomation.com.mx",waTxt:"56 2760 6710",rfc:"OAU980713BW3"};
const MSG_CATS=[["servicio","Servicio"],["toner","Tóner"],["clientes","Clientes"],["cotiz","Cotizaciones"],["prosp","Prospección"],["venta","Seminuevos"],["cobranza","Cobranza"],["equipo","Equipo"],["encuestas","Encuestas"]];

const mesesTodos=()=>{const s=new Set();S.equipos.forEach(e=>Object.keys(e.lect||{}).forEach(m=>s.add(m)));return [...s].sort().slice(-12)};
const totalMes=(e,m)=>{const v=(e.lect||{})[m];return v?(v.bn||0)+(v.color||0):0};
function slaInfo(t){
  if(t.estado==="cerrado"){const ok=t.fin&&t.compromiso&&t.fin<=t.compromiso;return{k:ok?"ok":"bad",txt:ok?"Cumplido":"Fuera de SLA",col:ok?"var(--ok)":"var(--bad)"}}
  if(!t.compromiso)return{k:"",txt:"Sin compromiso",col:"var(--line)"};
  const d=t.compromiso-Date.now();
  if(d<0)return{k:"bad",txt:"Vencido",col:"var(--bad)"};
  if(d<2*3600e3)return{k:"warn",txt:"Por vencer",col:"var(--warn)"};
  return{k:"ok",txt:"A tiempo",col:"var(--ok)"};
}
function compromiso(t){ // regla Bernardo: antes de 13:00 => mismo día 18:00; después => siguiente día hábil 12:00
  const d=cdmx(t);let y=d.getUTCFullYear(),mo=d.getUTCMonth(),da=d.getUTCDate(),h=d.getUTCHours(),dow=d.getUTCDay();
  const mk=(y,mo,da,hh)=>Date.UTC(y,mo,da,hh)-TZ;
  const habil=dow>=1&&dow<=5;
  if(habil&&h<13)return mk(y,mo,da,18);
  let x=new Date(Date.UTC(y,mo,da));do{x=new Date(x.getTime()+864e5)}while(x.getUTCDay()===0||x.getUTCDay()===6);
  return mk(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate(),12);
}
function prevDue(e){
  if(e.estatus!=="instalado")return null;
  const meses={mensual:1,bimestral:2,trimestral:3}[e.frec||"trimestral"];
  if(!e.ultPrev)return{due:true,txt:"Sin registro"};
  const next=new Date(e.ultPrev);next.setMonth(next.getMonth()+meses);
  return{due:next.getTime()<=Date.now()+15*864e5,txt:"Toca "+fd(next.getTime()),next:next.getTime()};
}

function header(t,p,acts=""){return `<div class="top"><div><h1>${t}</h1>${p?`<p>${p}</p>`:""}</div><div class="act">${acts}</div></div>`}
function vInicio(){
  const ms=mesesTodos();const last=ms[ms.length-1];
  const inst=[...S.equipos.values()].filter(e=>e.estatus==="instalado");
  const cliAct=new Set(inst.map(e=>e.clienteId)).size;
  let bn=0,co=0;inst.forEach(e=>{const v=(e.lect||{})[last];if(v){bn+=v.bn||0;co+=v.color||0}});
  const T=[...S.tickets.values()];const ab=T.filter(t=>t.estado!=="cerrado");const venc=ab.filter(t=>slaInfo(t).k==="bad").length;
  const mesIni=(()=>{const d=cdmx();return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)-TZ})();
  const cerr=T.filter(t=>t.estado==="cerrado"&&t.fin>=mesIni);const cump=cerr.length?Math.round(100*cerr.filter(t=>slaInfo(t).k==="ok").length/cerr.length):null;

  const mx=Math.max(1,...tots.map(x=>x.b+x.c));

  // top clientes
  const pc=new Map();inst.forEach(e=>{pc.set(e.clienteId,(pc.get(e.clienteId)||0)+totalMes(e,last))});
  const top=[...pc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
  const tmax=Math.max(1,...top.map(x=>x[1]));
  const prevs=inst.filter(e=>prevDue(e)?.due).length;
  const opps=[...S.opps.values()].filter(o=>!["ganado","perdido"].includes(o.etapa));
  const pipe=opps.reduce((s,o)=>s+(+o.valor||0),0);
  return header("Buen día"+(S.me?.name?", "+esc(S.me.name.split(" ")[0]):""),`Consumo de ${mlabel(last||"2026-09")} y operación de hoy.`,
   can("servicio")?`<button class="btn pri" data-a="nuevoTicket">+ Nuevo ticket</button>`:"")+
  `<div class="kpis">
    <div class="kpi"><i class="ink" style="background:var(--c)"></i><div class="v">${fmt(cliAct)}</div><div class="l">clientes con equipos instalados</div></div>
    <div class="kpi"><i class="ink" style="background:var(--m)"></i><div class="v">${fmt(inst.length)}</div><div class="l">equipos instalados</div></div>
    <div class="kpi"><i class="ink" style="background:var(--y)"></i><div class="v">${fmt(bn+co)}</div><div class="l">páginas en ${mlabel(last||"")} · ${fmt(co)} a color</div></div>
    <div class="kpi"><i class="ink" style="background:var(--k)"></i><div class="v">${ab.length}<span style="font-size:17px;color:${venc?"var(--bad)":"var(--muted)"}"> · ${venc} vencidos</span></div><div class="l">tickets abiertos${cump!==null?` · SLA del mes ${cump}%`:""}</div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="panel"><h2>Páginas impresas por mes</h2><div class="row sm muted"><span class="dot" style="background:var(--navy2)"></span>Blanco y negro <span class="dot" style="background:var(--m);margin-left:10px"></span>Color</div><div class="bars">${bars}</div></div>
    <div class="panel"><h2>Hoy en la operación</h2>
      <table class="tbl"><tr class="click" data-go="servicio"><td>Tickets abiertos</td><td class="b">${ab.length}</td></tr>
      <tr class="click" data-go="servicio"><td>Fuera de compromiso</td><td class="b" style="color:${venc?"var(--bad)":"inherit"}">${venc}</td></tr>
      <tr class="click" data-go="preventivos"><td>Preventivos por programar</td><td class="b">${prevs}</td></tr>
      <tr class="click" data-goct="1"><td>Contratos por vencer (90 días)</td><td class="b" style="color:${[...S.clientes.values()].some(c=>contratoInfo(c).k==="bad"&&c.contrato?.tipo==="firmado")?"var(--bad)":"inherit"}">${[...S.clientes.values()].filter(c=>["warn","bad"].includes(contratoInfo(c).k)&&c.contrato?.tipo==="firmado").length}</td></tr>
      <tr class="click" data-go="toner"><td>Solicitudes de tóner pendientes</td><td class="b">${[...S.sol.values()].filter(s=>s.estado!=="entregado").length}</td></tr>

   <table class="tbl">${top.map(([id,v],i)=>{const c=S.clientes.get(id);return `<tr class="click" data-cli="${esc(id)}"><td style="width:28px" class="muted">${i+1}</td><td>${esc(c?.nombre||id)}</td><td style="width:40%"><div style="height:8px;border-radius:4px;background:var(--teal);width:${Math.max(3,Math.round(100*v/tmax))}%"></div></td><td class="b" style="text-align:right">${fmt(v)}</td></tr>`}).join("")||`<tr><td class="empty">Sin lecturas cargadas.</td></tr>`}</table></div>`;
}
function ticketCard(t){const s=slaInfo(t);return `<div class="card" draggable="${can("asignar")}" data-tk="${esc(t._id)}"><div class="sla" style="background:${s.col}"></div><div class="row" style="justify-content:space-between"><span class="t">${esc(t.folio)}</span><span class="chip ${s.k}">${s.txt}</span></div><div>${esc(t.cliente||"")}</div><div class="muted sm">${esc(t.tipo)} · ${esc(t.modelo||"")} ${t.serie?"· "+esc(t.serie):""}</div><div class="muted sm">${esc(nombreDe(t.tecnicoId))} · compromiso ${fdt(t.compromiso)}</div></div>`}
function vServicio(){
  const f=S.filters.serv||{};const modo=f.modo||"estado";
  let T=[...S.tickets.values()];
  if(f.q){const q=f.q.toLowerCase();T=T.filter(t=>(t.folio+" "+t.cliente+" "+t.serie+" "+t.desc).toLowerCase().includes(q))}
  const hoy=Date.now()-7*864e5;T=T.filter(t=>t.estado!=="cerrado"||t.fin>hoy);
  T.sort((a,b)=>(a.compromiso||9e15)-(b.compromiso||9e15));
  let cols;
  if(modo==="estado")cols=ESTADOS.map(([k,n])=>({k,n,items:T.filter(t=>t.estado===k)}));
  else{const tec=tecnicos();cols=[{k:"",n:"Sin asignar",items:T.filter(t=>!t.tecnicoId&&t.estado!=="cerrado")},...tec.map(u=>({k:u.id,n:u.alias,items:T.filter(t=>t.tecnicoId===u.id&&t.estado!=="cerrado")}))]}
  return header("Servicio técnico","Compromiso: reporte antes de las 13:00, técnico el mismo día; después, al día hábil siguiente a mediodía.",`<button class="btn pri" data-a="nuevoTicket">+ Nuevo ticket</button>`)+

   <div class="board" data-board="${modo}">${cols.map(c=>`<div class="col" data-col="${esc(c.k)}"><h3>${esc(c.n)}<span>${c.items.length}</span></h3>${c.items.map(ticketCard).join("")||`<div class="muted sm" style="padding:4px">—</div>`}</div>`).join("")}</div>
   ${can("asignar")?`<p class="muted sm">Arrastra una tarjeta para cambiar su estado o asignarla a un técnico. En el celular, ábrela y usa los selectores.</p>`:""}`;
}
function vMiDia(){
  const hoy=new Date(Date.now()+TZ).toISOString().slice(0,10);const T=misTickets().sort((a,b)=>((a.prog===hoy?0:1)-(b.prog===hoy?0:1))||(a.orden??99)-(b.orden??99)||(a.compromiso||0)-(b.compromiso||0));
  const miId=misIds().find(id=>T.some(t=>t.tecnicoId===id&&t.prog===hoy));
  const PV=[...S.consultas.values()].filter(c=>c.estado==="lalo"&&c.paraLalo===S.me?.id).sort((a,b)=>a.tPreg-b.tPreg);

  const PA=[...S.consultas.values()].filter(c=>c.resp===S.me?.id&&c.pasadaA===S.me?.id&&!["venta","sin_venta"].includes(c.estado)).sort((a,b)=>b.fecha-a.fecha);
  const pa=PA.length?`<div class="panel" style="margin-bottom:14px"><h2>Compradores que atiendes <span class="muted sm">${PA.length} · seminuevos y refacciones</span></h2>${PA.map(c=>{const a=S.venta.get(c.articuloId);return `<div class="pitem click" data-vcon="${esc(c._id)}"><div style="min-width:0"><div class="b">${esc(c.nombre||"Comprador")} ${!c.vista?`<span class="chip bad">nuevo</span>`:""}</div><div class="sm">${a?esc(a.codigo+" · "+[a.marca,a.modelo].join(" ")+" · "):""}${esc((c.pregunta||"").slice(0,120))}</div><div class="muted sm">${esc(V_CANL[c.canal]||"")} · ${esc(c.contacto||"")}</div></div><button class="btn sm">Abrir</button></div>`}).join("")}</div>`:"";
  return pv+pa+header("Mi día",T.length?`${T.length} servicio${T.length>1?"s":""} asignado${T.length>1?"s":""}.`:"No tienes servicios pendientes.",`${botonEscanear("md_scan")}${miId?`<button class="btn" data-mdpdf="${esc(miId)}">PDF de mi día</button>`:""}`)+
   T.map(t=>{const s=slaInfo(t);const e=S.equipos.get(t.equipoId);return `<div class="tcard"><div class="row" style="justify-content:space-between"><span class="t">${esc(t.cliente)}</span><span class="chip ${s.k}">${s.txt} · ${fdt(t.compromiso)}</span></div>
   <div class="muted">${t.prog===hoy?`<b>Hoy${t.hora?" "+esc(t.hora):""}</b> · `:t.prog?sdate(t.prog)+" · ":""}${esc(t.tipo)} · ${esc(t.folio)}</div><div style="margin:6px 0">${esc(t.modelo||"")} ${t.serie?"· serie "+esc(t.serie):""}<br><span class="muted">${esc(t.ubicacion||e?.ubicacion||"")}</span></div>
   <div class="sm">${esc(t.desc||"")}</div>
   <div class="row" style="margin-top:12px">${t.estado==="asignado"||t.estado==="abierto"?`<button class="btn pri big" data-st="${esc(t._id)}" data-v="en_camino">Voy en camino</button>`:""}${t.estado==="en_camino"?`<button class="btn pri big" data-st="${esc(t._id)}" data-v="en_sitio">Llegué</button>`:""}<button class="btn big" data-tk="${esc(t._id)}">Abrir reporte</button></div></div>`}).join("")||`<div class="panel empty">Cuando Lalo te asigne un servicio aparecerá aquí.</div>`;
}
function vPrev(){
  const f=S.filters.prev||{};
  let E=[...S.equipos.values()].filter(e=>e.estatus==="instalado").map(e=>({e,p:prevDue(e)}));

  ${E.length>300?`<p class="muted sm">Mostrando 300 de ${E.length}. Filtra por frecuencia para ver el resto.</p>`:""}</div>`;

function vClientes(){
  const f=S.filters.cli||{};let C=[...S.clientes.values()];

  if(f.est)C=C.filter(c=>c.estatus===f.est);else C=C.filter(c=>c.estatus!=="inactivo"||f.q);

  ${C.map(c=>{const ab=[...S.tickets.values()].filter(t=>t.clienteId===c._id&&t.estado!=="cerrado").length;return `<tr class="click" data-cli="${esc(c._id)}"><td class="b">${esc(c.nombre)}${c.municipio?`<div class="muted sm" style="font-weight:400">${esc(c.municipio)}</div>`:""}</td><td><span class="chip ${c.estatus==="activo"?"ok":c.estatus==="prospecto"?"blue":""}">${esc(c.estatus)}</span></td><td>${c.equiposActivos??0}</td><td>${fmt(vol.get(c._id)||0)}</td><td>${ab||"—"}</td><td>${(()=>{const i=contratoInfo(c);return `<span class="chip ${i.k}">${esc(i.txt)}</span>`})()}</td></tr>`}).join("")||`<tr><td colspan="6" class="empty">Sin resultados.</td></tr>`}</table></div>`;
}
function vEquipos(){
  const f=S.filters.eq||{};let E=[...S.equipos.values()];
  if(!f.est)E=E.filter(e=>e.estatus!=="retirado");else E=E.filter(e=>e.estatus===f.est);
  if(f.marca)E=E.filter(e=>e.marca===f.marca);

  E.sort((a,b)=>(b.prom||0)-(a.prom||0));

function encStats(L){const E=L.map(t=>t.encuesta);const n=E.length;if(!n)return null;const nps=E.filter(e=>e.nps!=null);

let sigDirty=false;
function setupSig(L){const c=L.querySelector("#sig");if(!c)return;sigDirty=false;const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext("2d");x.scale(2,2);x.lineWidth=2.2;x.lineCap="round";x.strokeStyle="#16263D";let dn=false;
  const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener("pointerdown",e=>{dn=true;c.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b)});
  c.addEventListener("pointermove",e=>{if(!dn)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke();sigDirty=true});
  c.addEventListener("pointerup",()=>dn=false)}

async function vImportar(file){
  if(!window.XLSX){await new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)}).catch(()=>{})}
  if(!window.XLSX){toast("No se pudo abrir el lector de Excel");return}
  const wb=XLSX.read(await file.arrayBuffer());const ws=wb.Sheets["Productos"]||wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  const hi=rows.findIndex(r=>r.some(c=>/modelo/i.test(String(c))));if(hi<0){toast("No encuentro la fila de encabezados (Modelo exacto)");return}
  const H=rows[hi].map(h=>String(h).toLowerCase());const col=re=>H.findIndex(h=>re.test(h));
  const C={codigo:col(/^id$/),tipo:col(/^tipo/),marca:col(/marca/),modelo:col(/modelo/),compatible:col(/compatible/),estado:col(/^estado/),contador:col(/contador/),specs:col(/especific/),incluye:col(/incluye/),cantidad:col(/cantidad/),precio:col(/precio/),negociable:col(/negociable/),garantia:col(/garant/),entrega:col(/entrega/),envio:col(/env[ií]o/),notas:col(/^notas/)};
  const existentes=new Set([...S.venta.values()].map(a=>a.codigo));let n=0,omit=0;
  for(const r of rows.slice(hi+1)){const g=k=>C[k]>=0?r[C[k]]:"";if(!String(g("modelo")).trim()&&!String(g("marca")).trim())continue;
    const cod=String(g("codigo")||"").trim()||vSiguiente();if(existentes.has(cod)||(cod==="OA-001"&&/M2040dn/i.test(g("modelo"))&&+g("precio")===6500)){omit++;continue}
    const si=v=>/^s[ií]/i.test(String(v));const a={codigo:cod,tipo:g("tipo")||"Otro",marca:String(g("marca")).trim(),modelo:String(g("modelo")).trim(),compatible:String(g("compatible")).trim(),estado:g("estado")||"Seminuevo",contador:+g("contador")||"",specs:String(g("specs")).trim(),incluye:String(g("incluye")).trim(),
     cantidad:+g("cantidad")||1,precio:+String(g("precio")).replace(/[^\d.]/g,"")||"",negociable:si(g("negociable")),garantia:String(g("garantia")).trim(),entrega:String(g("entrega")).trim(),envio:si(g("envio")),notas:String(g("notas")).trim(),estatus:"borrador",fotos:[],pub:{},ventas:[],creado:Date.now(),por:S.me?.id||""};
    const nid=uid();if(await save("venta/"+nid,a)){S.venta.set(nid,{...a,_id:nid});existentes.add(cod);n++}}
  toast(`Importados ${n} artículos${omit?` · ${omit} omitidos (ya existían o eran el ejemplo)`:""}`);render()}

/* Lector de código de barras / QR del número de serie desde una foto */
function cargarScript(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function leerCodigo(file){
  try{if("BarcodeDetector" in window){const bd=new BarcodeDetector({formats:["code_39","code_128","qr_code","data_matrix","ean_13"]});const r=await bd.detect(await createImageBitmap(file));if(r.length)return r[0].rawValue}}catch(e){}
  if(!window.ZXing){try{await cargarScript("https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js")}catch(e){return null}}
  const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(file)});
  const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.DATA_MATRIX]);hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  const rd=new ZXing.MultiFormatReader();rd.setHints(hints);
  const probar=(c)=>{for(const Bz of [ZXing.HybridBinarizer,ZXing.GlobalHistogramBinarizer]){try{const r=rd.decode(new ZXing.BinaryBitmap(new Bz(new ZXing.HTMLCanvasElementLuminanceSource(c))));if(r)return r.getText()}catch(e){}}return null};
  const lienzo=(w,ang,crop)=>{const s=Math.min(1,w/Math.max(img.width,img.height));const W=img.width*s,H=img.height*s;const c=document.createElement("canvas");
    const rad=ang*Math.PI/180,cw=Math.abs(W*Math.cos(rad))+Math.abs(H*Math.sin(rad)),ch=Math.abs(W*Math.sin(rad))+Math.abs(H*Math.cos(rad));c.width=Math.round(cw);c.height=Math.round(ch);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.translate(cw/2,ch/2);x.rotate(rad);x.drawImage(img,-W/2,-H/2,W,H);
    if(!crop)return c;const k=document.createElement("canvas");k.width=c.width;k.height=Math.round(c.height*crop[1]);k.getContext("2d").drawImage(c,0,c.height*crop[0],c.width,k.height,0,0,k.width,k.height);return k};
  for(const w of [1400,2000,900]){for(const ang of [0,-6,6,-12,12,90,-90]){const t=probar(lienzo(w,ang));if(t)return t}}
  for(const w of [1600,2400]){for(const ang of [0,-6,6,-12,12]){for(let y=0;y<0.8;y+=0.15){const t=probar(lienzo(w,ang,[y,0.3]));if(t)return t}}}
  return null}
const normSerie=t=>String(t||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
async function escanearSerie(file){toast("Leyendo la etiqueta…");const txt=await leerCodigo(file);if(!txt){toast("No pude leer el código. Acerca la cámara a la etiqueta, con buena luz, o escribe la serie.");return null}
  const s=normSerie(txt);const e=S.equipos.get(s)||[...S.equipos.values()].find(x=>normSerie(x.serie)===s);return{serie:s,equipo:e||null}}
function botonEscanear(id){return `<label class="btn sm" title="Toma una foto de la etiqueta del número de serie">📷 Escanear serie<input type="file" accept="image/*" capture="environment" id="${id}" class="hide"></label>`}

/* ===================== arranque ===================== */
function gate(html){S.gateOk=false;$("#nav").innerHTML="";$("#mnav").innerHTML="";$("#main").innerHTML=`<div class="gate">${html}</div>`}
function decideRole(){
  const u=S.usuarios[S.me?.id];S.rol=S.owner?"admin":(u?.rol||null);
  if(!S.rol){gate(`<div class="iso" style="justify-content:center;display:inline-grid;margin-bottom:14px"><i style="background:var(--c)"></i><i style="background:var(--m)"></i><i style="background:var(--y)"></i><i style="background:var(--k)"></i></div><h1 style="margin:0 0 8px">Te damos acceso en un momento</h1><p class="muted">Entraste como <code>${esc(S.me?.id||"")}</code>. Pídele a Toni que te asigne tu rol en OA 360; cuando lo haga, esta pantalla se abre sola.</p><p><button class="btn pri" onclick="location.reload()">Ya me dieron acceso</button> <button class="btn" onclick="logout()">Salir</button></p>`);S.sinRol=true;return false}
  if(S.sinRol){location.reload();return false} // la base de datos solo entrega datos con rol: recargar al recibirlo
  S.gateOk=true;return true;
}
function listen(path,map,lim=1000){db.collection(path).limit(lim).onSnapshot(s=>{map.clear();s.docs.forEach(d=>map.set(d.id,{...d.data(),_id:d.id}));S.ready[path]=true;if(S.gateOk)later()},e=>{console.warn(path,e)})}

/* ===================== Supabase: adaptador de datos ===================== */
let sb=null;
const fotoUrl=p=>/^https?:/.test(p)?p:sb.storage.from("fotos").getPublicUrl(p).data.publicUrl;
function mkDb(){
  const subs=new Set();
  const ch=sb.channel("docs-rt").on("postgres_changes",{event:"*",schema:"public",table:"docs"},pl=>{const r=pl.new&&pl.new.col?pl.new:pl.old;subs.forEach(f=>f(pl.eventType,r,pl.new))}).subscribe();
  const snapDoc=(id,data)=>({id,exists:!!data,data:()=>data||undefined});
  async function fetchCol(col){let out=[],from=0;for(;;){const {data,error}=await sb.from("docs").select("id,data").eq("col",col).range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
  const doc=path=>{const [col,id]=path.split("/");return{
    async get(){const {data,error}=await sb.from("docs").select("data").eq("col",col).eq("id",id).maybeSingle();if(error)throw error;return snapDoc(id,data?.data)},
    async set(d){const {error}=await sb.from("docs").upsert({col,id,data:d,updated_at:new Date().toISOString()});if(error)throw error},
    async update(p){const {error}=await sb.rpc("doc_merge",{p_col:col,p_id:id,p_patch:p});if(error)throw error},
    async del(){const {error}=await sb.from("docs").delete().eq("col",col).eq("id",id);if(error)throw error},
    onSnapshot(next,err){let cur=null;this.get().then(s=>{cur=s;next(s)}).catch(e=>err&&err(e));
      const f=(ev,r,nw)=>{if(!r||r.col!==col||r.id!==id)return;next(snapDoc(id,ev==="DELETE"?null:nw.data))};subs.add(f);return()=>subs.delete(f)}}};
  const collection=col=>{const q={limit:()=>q,
    onSnapshot(next,err){const m=new Map();const emit=()=>next({docs:[...m.entries()].map(([id,d])=>snapDoc(id,d)),size:m.size,empty:!m.size});
      fetchCol(col).then(rows=>{rows.forEach(r=>m.set(r.id,r.data));emit()}).catch(e=>err&&err(e));
      let t=null;const f=(ev,r,nw)=>{if(!r||r.col!==col)return;if(ev==="DELETE")m.delete(r.id);else m.set(nw.id,nw.data);clearTimeout(t);t=setTimeout(emit,120)};subs.add(f);return()=>subs.delete(f)}};return q};
  return{doc,collection};
}
window.logout=async()=>{await sb.auth.signOut();location.reload()};
function loginScreen(msg){gate(`<div class="iso" style="display:inline-grid;margin-bottom:14px"><i style="background:var(--c)"></i><i style="background:var(--m)"></i><i style="background:var(--y)"></i><i style="background:var(--k)"></i></div><h1 style="margin:0 0 6px">OA 360</h1><p class="muted">Sistema interno de Office Automation.</p>
  <div style="display:grid;gap:10px;max-width:340px;margin:16px auto 0;text-align:left"><label class="fl">Correo<input class="f" id="lg_e" type="email" autocomplete="username" placeholder="tu@officeautomation.com.mx"></label>
   <label class="fl">Contraseña<input class="f" id="lg_p" type="password" autocomplete="current-password" placeholder="La que te dio Toni"></label>
   <button class="btn pri" id="lg_b" style="justify-content:center">Entrar</button>
   <button class="btn" id="lg_l" style="justify-content:center">No tengo contraseña: enviarme un enlace por correo</button></div><p class="sm" id="lg_m" style="margin-top:12px">${esc(msg||"")}</p>`);
  const em=()=>$("#lg_e").value.trim().toLowerCase();
  const entrar=async()=>{const e=em(),pw=$("#lg_p").value;if(!e||!pw){$("#lg_m").textContent="Escribe tu correo y tu contraseña.";return}$("#lg_b").disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:e,password:pw});$("#lg_b").disabled=false;if(error)$("#lg_m").textContent="Correo o contraseña incorrectos. Si no tienes contraseña, pide el enlace por correo."};
  const enlace=async()=>{const e=em();if(!e){$("#lg_m").textContent="Escribe tu correo.";return}$("#lg_l").disabled=true;
    const {error}=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});
    $("#lg_m").textContent=error?"No pudimos enviarte el enlace. Revisa el correo o pide a Toni que te dé acceso.":"Listo: revisa tu correo y abre el enlace desde este mismo dispositivo.";$("#lg_l").disabled=false};
  $("#lg_b").onclick=entrar;$("#lg_l").onclick=enlace;$("#lg_p").addEventListener("keydown",e=>{if(e.key==="Enter")entrar()});$("#lg_e").addEventListener("keydown",e=>{if(e.key==="Enter")$("#lg_p").focus()})}
window.cambiarClave=()=>drawer(`<button class="btn sm x" data-close>Cerrar</button><h2>Cambiar mi contraseña</h2><p class="muted">Mínimo 8 caracteres. La usarás para entrar con tu correo.</p><div class="panel"><div class="form"><label class="fl">Nueva contraseña<input class="f" id="cc_1" type="password" autocomplete="new-password"></label><label class="fl">Repítela<input class="f" id="cc_2" type="password" autocomplete="new-password"></label></div><div class="row" style="margin-top:12px"><button class="btn pri" id="cc_b">Guardar contraseña</button></div></div>`,L=>{bindCommon(L);
  L.querySelector("#cc_b").onclick=async()=>{const a=L.querySelector("#cc_1").value,b=L.querySelector("#cc_2").value;if(a.length<8){toast("Mínimo 8 caracteres");return}if(a!==b){toast("Las contraseñas no coinciden");return}
   const {error}=await sb.auth.updateUser({password:a});if(error)toast("No se pudo cambiar: "+error.message);else{toast("Contraseña cambiada");closeDr()}}});
async function start(session){
  const email=(session.user.email||"").toLowerCase();
  S.me={id:email,name:email.split("@")[0],isOwner:(window.OA_CONFIG.ADMINS||[]).map(x=>x.toLowerCase()).includes(email)};S.owner=S.me.isOwner;S.canWrite=true;
  db=mkDb();
  db.doc("config/usuarios").onSnapshot(s=>{S.usuarios=(s.exists&&s.data().u)||{};if(decideRole()){const u=S.usuarios[S.me.id];if(u?.alias)S.me.name=u.alias;$("#who").innerHTML=`<b>${esc(u?.alias||S.me.name)}</b>${esc(ROLES[S.rol]||"")}<div><a href="#" onclick="cambiarClave();return false" style="color:#8FA3BD;font-size:12.5px">Contraseña</a> · <a href="#" onclick="logout();return false" style="color:#8FA3BD;font-size:12.5px">Salir</a></div>`;render()}});
  db.doc("config/toner").onSnapshot(s=>{S.toner=(s.exists&&s.data().items)||[];if(S.gateOk)later()});
  listen("clientes",S.clientes);listen("equipos",S.equipos);listen("tickets",S.tickets);listen("oportunidades",S.opps);listen("solicitudes",S.sol);listen("inventario",S.inv);listen("cotizaciones",S.cot);listen("venta",S.venta);listen("tecnicos",S.tecs);listen("vehiculos",S.vehiculos);listen("plantillas",S.plantillas);listen("consultas",S.consultas);listen("tareas",S.tareas);
  db.doc("config/crm").onSnapshot(s=>{S.crm=(s.exists&&s.data())||null;if(S.gateOk)later()});
  db.doc("crm_hechos/"+new Date(Date.now()+TZ).toISOString().slice(0,10)).onSnapshot(s=>{S.crmHechos=(s.exists&&s.data())||{};if(S.gateOk)later()});
  db.doc("config/empresa").onSnapshot(s=>{S.empresa=(s.exists&&s.data())||{}});
}
(async()=>{
  const C=window.OA_CONFIG||{};
  if(!C.SUPABASE_URL||C.SUPABASE_URL.includes("PEGA")){gate(`<h1>Falta configurar</h1><p class="muted">Edita <code>config.js</code> con la URL y la clave pública de Supabase.</p>`);return}
  sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(session)start(session);else loginScreen();
  sb.auth.onAuthStateChange((ev,ses)=>{if(ev==="SIGNED_IN"&&ses&&!S.me)start(ses)});
})();
</script>
